name: Stubenspiele APK
on:
  push:
    branches: [main]
    paths: ["stubenspiele/**", ".github/workflows/stubenspiele.yml"]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: stubenspiele
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Version stempeln
        run: |
          echo "window.STUBEN_BUILD={apk:${{ github.run_number }},sha:'${GITHUB_SHA::7}',date:'$(date -u +%Y-%m-%d)'};" > stubenspiele/app/src/main/assets/version.js
          cp stubenspiele/app/src/main/assets/version.js spiele/version.js
          cat spiele/version.js
      - name: APK bauen
        working-directory: stubenspiele
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then
            { echo "Build-Log (letzte 150 Zeilen):"; echo '```'; grep -vE '^\s+at |^\s+\.\.\. [0-9]+ more' build.log | tail -n 120; echo '```'; } > fehler.md
            gh issue create --title "Stubenspiele-Build fehlgeschlagen (Run ${{ github.run_number }})" --body-file fehler.md || true
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../Stubenspiele.apk
        env:
          GH_TOKEN: ${{ github.token }}
          APK_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Stubenspiele-apk
          path: Stubenspiele.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stubenspiele-latest
          name: Stubenspiele Android (aktuell)
          body: "Stubenspiele – Schnauz, Kniffel, Vier Farben, 17 und 4 und eine Spielhalle für 2–8 Leute (WLAN/Hotspot, Internet oder ein Gerät). Stubenspiele.apk herunterladen, öffnen, Installation erlauben. Ab Version 1.48 meldet die App neue Versionen selbst; der Download läuft über den Browser."
          files: Stubenspiele.apk
      - name: Versionsnummer für die Web-Seite veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- stubenspiele/app/src/main/assets/version.js
          git add spiele/version.js
          git diff --cached --quiet || (git commit -m "Stubenspiele Web: Version ${{ github.run_number }} [skip ci]" && git pull --rebase --autostash origin main && git push)
