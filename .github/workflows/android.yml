name: Android APK
on:
  push:
    branches: [main]
    paths: ["index.html", "icon-*.png", "app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Web-App in das Android-Projekt kopieren
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          rm -rf www && mkdir -p www/leaflet
          cp ../index.html www/index.html
          cp ../icon-192.png ../icon-512.png www/
          cp node_modules/leaflet/dist/leaflet.js node_modules/leaflet/dist/leaflet.css www/leaflet/
          cp -r node_modules/leaflet/dist/images www/leaflet/images
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          sed -i 's#https://unpkg.com/leaflet@1.9.4/dist/leaflet.css#leaflet/leaflet.css#; s#https://unpkg.com/leaflet@1.9.4/dist/leaflet.js#leaflet/leaflet.js#' www/index.html
          sed -i 's#<script src="leaflet/leaflet.js"></script>#<script src="capacitor.js"></script>\n<script src="leaflet/leaflet.js"></script>#' www/index.html
          grep -c 'capacitor.js' www/index.html
          sed -i '/manifest.webmanifest/d; /apple-touch-icon/d' www/index.html
          npx cap sync android
      - name: APK bauen
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Stempel-Radar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Stempel-Radar-apk
          path: Stempel-Radar.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Stempel-Radar Android (aktuell)
          body: "Neueste Android-App. Auf dem Handy Stempel-Radar.apk herunterladen, öffnen und Installation aus unbekannter Quelle erlauben."
          files: Stempel-Radar.apk
