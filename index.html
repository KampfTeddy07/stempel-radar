.sheet-in{background:var(--paper);color:var(--fg);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}

.sheet-in .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet-in label.status{flex-direction:row;align-items:center;gap:8px;font-size:13px}.sheet-in .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:5px}

<body>
<div class="top">
  <div class="row"><h1>Stempel-Radar Japan</h1><span class="cnt" id="count"></span></div>
  <div class="chips" id="regions"></div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="when"></div>
</div>
<div id="map" style="position:relative"></div>
<div class="bottom">
<details class="fx" id="fx"><summary>¥ Umrechner <small id="fxRate">Kurse laden …</small></summary>
    <div class="grid"><label>Yen ¥<input type="text" inputmode="decimal" autocomplete="off" id="fxJPY" placeholder="1'000"></label><label>Franken CHF<input type="text" inputmode="decimal" autocomplete="off" id="fxCHF" placeholder="5.20"></label><label>Euro €<input type="text" inputmode="decimal" autocomplete="off" id="fxEUR" placeholder="5,65"></label></div>
    <div class="rate"><span id="fxInfo"></span><button type="button" id="fxRefresh">Kurse aktualisieren</button></div></details>
  <div class="tools"><button type="button" class="btn add" id="addBtn">＋ Eigener Stempel</button><input type="search" id="q" placeholder="Suchen …"><label class="status"><input type="checkbox" id="hideDone"> gesammelte ausblenden</label></div>
  <details class="fx" id="bk"><summary>Sicherung der Häkchen <small id="bkInfo"></small></summary>
    <div class="bk"><button type="button" class="btn" id="bkCopy">Backup-Code kopieren</button><span style="font-size:12px;color:var(--muted)">Code irgendwo sichern (Notizen, Chat) oder an deinen Freund schicken.</span></div>
    <div class="bk"><input type="text" id="bkIn" placeholder="Backup-Code hier einfügen" autocomplete="off"><button type="button" class="btn" id="bkRestore">Wiederherstellen</button></div>
    <div id="bkOut" style="font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all"></div></details>
  <div class="radar"><label><input type="checkbox" id="radarOn"> Radar: melden, wenn ein Stempel im Umkreis von</label><select id="radarR"><option value="300">300 m</option><option value="500">500 m</option><option value="700" selected>700 m</option><option value="1000">1 km</option></select><label><input type="checkbox" id="wake"> Bildschirm anlassen</label></div>
  <div class="alert" id="alert"></div>
  <div class="sheet" id="addSheet" hidden><div class="sheet-in">
    <div class="row" style="justify-content:space-between"><b>Eigenen Stempel hinzufügen</b><button type="button" class="btn" id="addClose">Schließen</button></div>
    <label>Name<input type="text" id="addName" placeholder="z. B. Bahnhof Kamakura" maxlength="60" autocomplete="off"></label>
    <div class="grid2"><label>Art<select id="addCat"></select></label><label>Region<select id="addReg"></select></label></div>
    <label>Hinweis (wo ist der Stempel?)<input type="text" id="addTip" placeholder="z. B. am Infoschalter links" maxlength="90" autocomplete="off"></label>
    <div class="row"><span class="status" id="addPos">Position: noch keine</span></div>
    <div class="row"><button type="button" class="btn" id="addUseGps">📍 Mein Standort</button><button type="button" class="btn" id="addUseMap">🗺️ Kartenmitte</button><span style="font-size:12px;color:var(--muted)">oder Karte lange drücken</span></div>
    <label class="status"><input type="checkbox" id="addDone" checked> gleich als gesammelt markieren (mit Datum/Uhrzeit)</label>
    <button type="button" class="btn primary" id="addSave" disabled>Stempel speichern</button>
  </div></div>
  <div class="status" id="status">GPS wird gesucht …</div>
  <div id="list"></div>
</div>

  if(f.d){const i=t.lastIndexOf(f.d);if(i>=0){ip=t.slice(0,i);dp=t.slice(i+1).replace(/[^\d]/g,"").slice(0,2)}}
  ip=ip.replace(/[^\d]/g,"");return{ip,dp}}
function fxParse(k,str){const {ip,dp}=fxSplit(k,str);if(!ip&&!dp)return NaN;return parseFloat((ip||"0")+"."+(dp||"0"))}
function fxFormatTyped(k,str){const f=FMT[k],{ip,dp}=fxSplit(k,str);let out=group(ip,f.g);if(dp!==null&&f.d)out+=f.d+dp;return out}
const fxFmt={JPY:v=>group(String(Math.round(v)),"'"),CHF:v=>{const [i,d]=v.toFixed(2).split(".");return group(i,"'")+"."+d},EUR:v=>{const [i,d]=v.toFixed(2).split(".");return group(i,".")+","+d}};
function fxCalc(from){const v=fxParse(from,fxIn[from].value);if(isNaN(v)){Object.keys(fxIn).forEach(k=>{if(k!==from)fxIn[k].value=""});return}const yen=from==="JPY"?v:v*fx[from];
  if(from!=="JPY")fxIn.JPY.value=fxFmt.JPY(yen);if(from!=="CHF")fxIn.CHF.value=fxFmt.CHF(yen/fx.CHF);if(from!=="EUR")fxIn.EUR.value=fxFmt.EUR(yen/fx.EUR)}
Object.keys(fxIn).forEach(k=>{const el=fxIn[k];
  el.addEventListener("input",()=>{const raw=el.value,caret=el.selectionStart==null?raw.length:el.selectionStart;const sig=raw.slice(0,caret).replace(/[^\d.,]/g,"").length;
    const out=fxFormatTyped(k,raw);el.value=out;let n=0,pos=out.length;if(sig===0)pos=0;else{for(let i=0;i<out.length;i++){if(/[\d.,]/.test(out[i])){n++;if(n===sig){pos=i+1;break}}}}
    try{el.setSelectionRange(pos,pos)}catch(e){}fxCalc(k)});
  el.addEventListener("blur",()=>{const v=fxParse(k,el.value);if(!isNaN(v))el.value=fxFmt[k](v)})});
async function fxLoad(){try{const r=await fetch("https://api.frankfurter.dev/v1/latest?from=CHF&to=JPY,EUR",{cache:"no-store"});const d=await r.json();if(d&&d.rates&&d.rates.JPY){fx={CHF:d.rates.JPY,EUR:d.rates.JPY/d.rates.EUR,date:d.date,src:"EZB-Kurs"};store.set("fx",fx);fxShow();const a=Object.keys(fxIn).find(k=>fxIn[k].value);if(a)fxCalc(a)}}catch(e){fxShow()}}
$("fxRefresh").onclick=fxLoad;fxShow();fxLoad();
// Radar: Vibration, Ton und Benachrichtigung, sobald ein ungesammelter Stempel im Umkreis liegt
let radar=store.get("radar",false),radarR=store.get("radarR",700),alerted=new Set(),wakeLock=null,actx=null;
$("radarOn").checked=radar;$("radarR").value=radarR;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch(e){}}
async function notify(title,body){if(native&&LN){try{await LN.schedule({notifications:[{id:Math.floor(Math.random()*1e6),title,body,schedule:{at:new Date(Date.now()+300),allowWhileIdle:true}}]})}catch(e){}return}try{if("Notification" in window&&Notification.permission==="granted"){const reg=await navigator.serviceWorker.getRegistration();if(reg&&reg.showNotification){reg.showNotification(title,{body,tag:"stempel-radar",renotify:true,vibrate:[200,100,200,100,400],icon:"icon-192.png"});return}new Notification(title,{body})}}catch(e){}}
function checkRadar(){if(!radar||!pos)return;const near=ALL.filter(e=>!done.has(e.id)).map(e=>({...e,d:km(pos,e)})).filter(e=>e.d*1000<=radarR).sort((a,b)=>a.d-b.d);
  const box=$("alert");if(!near.length){box.className="alert";box.textContent="";alerted.forEach(id=>{const e=byId(id);if(!e||km(pos,e)*1000>radarR+150)alerted.delete(id)});return}
  box.className="alert on";box.innerHTML="Stempel in der Nähe: "+near.slice(0,3).map(e=>esc(e.n)+" ("+fmtKm(e.d)+")").join(", ")+(near.length>3?" +"+(near.length-3):"")+"<small>Antippen in der Liste zeigt den Weg.</small>";
  const fresh=near.filter(e=>!alerted.has(e.id));if(!fresh.length)return;fresh.forEach(e=>alerted.add(e.id));
  try{navigator.vibrate&&navigator.vibrate([200,100,200,100,400])}catch(e){}beep();
  notify("Stempel in "+fmtKm(fresh[0].d)+": "+fresh[0].n,(fresh.length>1?fresh.length+" Stempel im Umkreis – ":"")+fresh[0].jp+" · "+fresh[0].t)}
$("radarOn").onchange=async e=>{radar=e.target.checked;store.set("radar",radar);if(radar){beep();try{if(native&&LN)await LN.requestPermissions();else if("Notification" in window&&Notification.permission==="default")await Notification.requestPermission()}catch(x){}alerted.clear();checkRadar()}else{$("alert").className="alert"}if(native)startNative()};
$("radarR").onchange=e=>{radarR=+e.target.value;store.set("radarR",radarR);alerted.clear();checkRadar();if(native&&radar)startNative()};
async function setWake(on){try{if(on&&"wakeLock" in navigator){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{if($("wake").checked)setTimeout(()=>setWake(true),500)})}else if(wakeLock){wakeLock.release();wakeLock=null}}catch(e){$("status").textContent="Bildschirm-an wird von diesem Browser nicht unterstützt."}}
$("wake").onchange=e=>setWake(e.target.checked);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&$("wake").checked)setWake(true)});
// GPS
const locBtn=document.createElement("button");locBtn.className="locbtn";locBtn.textContent="◎";locBtn.title="Zu mir";locBtn.onclick=()=>{follow=true;if(pos)go(()=>map.setView([pos.lat,pos.lng],Math.max(map.getZoom(),15)))};$("map").appendChild(locBtn);
function onPos(lat,lng,acc){pos={lat,lng};const ll=[lat,lng];const p={coords:{accuracy:acc||0}};
  if(!meMarker){meMarker=L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:"#1d6fe0",fillOpacity:1}).addTo(map).bindTooltip("Du",{permanent:true,direction:"top",offset:[0,-8]});meCircle=L.circle(ll,{radius:p.coords.accuracy,color:"#1d6fe0",weight:1,fillOpacity:.1}).addTo(map);go(()=>map.setView(ll,15))}
  else{meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(p.coords.accuracy);if(follow)go(()=>map.panTo(ll))}
  $("status").textContent="GPS aktiv (±"+Math.round(p.coords.accuracy)+" m) – Liste nach Entfernung sortiert";renderList();checkRadar()}

function onErr(msg){$("status").textContent="Kein GPS: "+msg;if(!pos)fitRegion()}
let watcherId=null;
async function startNative(){try{if(watcherId){await BG.removeWatcher({id:watcherId});watcherId=null}
  const opts={requestPermissions:true,stale:false,distanceFilter:radar?25:50};
  if(radar){opts.backgroundTitle="Stempel-Radar aktiv";opts.backgroundMessage="Sucht Stempel im Umkreis von "+(radarR>=1000?"1 km":radarR+" m")+" – zum Beenden Radar in der App ausschalten"}
  watcherId=await BG.addWatcher(opts,(loc,err)=>{if(err){onErr(err.code==="NOT_AUTHORIZED"?"Standort nicht erlaubt – bitte in den Android-Einstellungen freigeben":err.message||String(err));if(err.code==="NOT_AUTHORIZED")BG.openSettings();return}onPos(loc.latitude,loc.longitude,loc.accuracy)})}
  catch(e){onErr(e.message||String(e))}}
if(native&&BG){$("wake").parentElement.hidden=true;startNative()}
else if(navigator.geolocation){navigator.geolocation.watchPosition(p=>onPos(p.coords.latitude,p.coords.longitude,p.coords.accuracy),err=>onErr(err.message+" – Standortfreigabe im Browser prüfen."),{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
else{$("status").textContent="Dieser Browser kann keinen Standort liefern.";fitRegion()}

if(!native&&"serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
