plugins { id 'com.android.application' }

android {
    namespace "ch.stubenspiele"
    compileSdk 34
    defaultConfig {
        applicationId "ch.stubenspiele"
        minSdk 21
        targetSdk 34
        def build = (System.getenv("APK_BUILD") ?: "1") as Integer
        versionCode = build
        versionName = "1." + build
    }
    signingConfigs {
        release {
            storeFile file("../keystore/stubenspiele.jks")
            storePassword "stubenspiele2026"
            keyAlias "stubenspiele"
            keyPassword "stubenspiele2026"
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
