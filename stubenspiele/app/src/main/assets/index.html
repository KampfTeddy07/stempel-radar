    h+=`<div class="result"><p class="notice">${mine.bet>0?myRes||'':'Du hast ausgesetzt.'} Bank: ${g.dealer.val}${g.dealer.bj?' (17 und 4)':g.dealer.val>21?' (überkauft)':''}.</p>`;
    const alive=g.players.filter(p=>p.chips>0).length;
    h+=autoNote()+(r.isHost?`<button class="btn btn-primary btn-big" data-a="bjNext" ${C.busy?'disabled':''}>${alive>=1?(autoLeft()?'Nächste Runde jetzt':'Nächste Runde'):'Spiel vorbei'}</button>`:`<p class="notice soft">${autoLeft()?'Geht gleich automatisch weiter.':'Der Gastgeber startet die nächste Runde.'}</p>`);
    h+='</div>';
  }
  return h;
}

function toastHtml(){return`<div class="toasts">${toasts.map(t=>`<div class="toast ${t.cls}">${t.text}</div>`).join('')}</div>`;}
function render(){
  const active=document.activeElement;const keep=active&&active.dataset&&active.dataset.f?{f:active.dataset.f,s:active.selectionStart}:null;
  if((C.page==='claw'&&C.claw&&C.claw.busy&&$app.querySelector('.machine'))||(C.page==='slots'&&C.slots&&C.slots.busy&&$app.querySelector('.slotbox'))||(C.page==='plinko'&&C.plk&&C.plk.busy&&$app.querySelector('.plkbox'))){const tb=$app.querySelector('.toasts');if(tb)tb.outerHTML=toastHtml();return;}
  let h=C.online||C.page==='home'||isArcade()?'':(C.mode==='lan'&&!C.isHost?`<div class="offline wide"><b>Keine Verbindung zum Gastgeber-Handy.</b><span>Dein Handy ist vermutlich auf mobile Daten gesprungen, weil der Hotspot kein Internet hat. Abhilfe: <b>mobile Daten kurz aus</b> – oder in der Meldung „WLAN ohne Internet“ auf <b>Trotzdem verbunden bleiben</b> tippen (iPhone: WLAN-Unterstützung aus).</span><button class="btn btn-primary" data-a="reload">Neu verbinden</button></div>`:'<div class="offline">Verbindung wird neu aufgebaut …</div>');
  h+=toastHtml();
  if(C.page==='claw')h+=claw();else if(C.page==='slots')h+=slots();else if(C.page==='solitaire')h+=solitaire();else if(C.page==='mines')h+=mines();else if(C.page==='t2048')h+=t2048();else if(C.page==='plinko')h+=plinko();else if(C.mode==='local'&&LOCAL.handoff!==null&&C.handoffRoom)h+=handoffView();else if(C.page==='home'||!C.room)h+=home();else if(C.page==='lobby')h+=lobby();else h+=C.room.view.game==='schnauz'?schnauz():C.room.view.game==='uno'?uno():C.room.view.game==='bj'?bj():kniffel();
  $app.innerHTML=h;
  $app.classList.toggle('game',!!(C.room&&C.page!=='home'&&C.page!=='lobby'));
  if(C.page==='slots')slotsMount();
  if(C.page==='plinko')plkDraw();
  if(isArcade()){const nav=$app.querySelector('.arcnav'),on=nav&&nav.querySelector('.is-on');if(on&&nav.scrollWidth>nav.clientWidth)nav.scrollLeft=Math.max(0,on.offsetLeft-(nav.clientWidth-on.offsetWidth)/2);}
  const kAge=Date.now()-C.knockAt;if(kAge<1500&&!$app.classList.contains('tableshake')){$app.classList.add('tableshake');setTimeout(()=>$app.classList.remove('tableshake'),1500-kAge);}
  if(keep){const el=$app.querySelector(`[data-f="${keep.f}"]`);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.s);}catch(e){}}}
}

$app.addEventListener('input',e=>{const t=e.target;if(!t.dataset.f)return;if(t.dataset.f==='lname'){LOCAL.nameIn=t.value;const b=$app.querySelector('[data-a="localAdd"]');if(b)b.disabled=!t.value.trim();return;}C[t.dataset.f]=t.dataset.f==='codeIn'?t.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,C.mode==='online'?6:4):t.value;if(t.dataset.f==='name')persist();
  if(t.dataset.f==='codeIn'){const b=$app.querySelector('[data-a="join"]');if(b)b.disabled=C.codeIn.length<(C.mode==='online'?6:4)||C.busy;}});
let minLP=null;
$app.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-a="minTap"]');C.mSkip=false;clearTimeout(minLP);if(!t||t.disabled)return;const i=+t.dataset.i;minLP=setTimeout(()=>{minLP=null;C.mSkip=true;minTap(i,true);},380);});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$app.addEventListener(ev,()=>{clearTimeout(minLP);minLP=null;}));
$app.addEventListener('pointermove',e=>{if(minLP&&!e.target.closest('[data-a="minTap"]')){clearTimeout(minLP);minLP=null;}});
$app.addEventListener('contextmenu',e=>{if(e.target.closest('.mingrid'))e.preventDefault();});
let tSw=null;
$app.addEventListener('pointerdown',e=>{const b=e.target.closest('.tboard');tSw=b?{x:e.clientX,y:e.clientY,id:e.pointerId}:null;},{passive:true});
$app.addEventListener('pointerup',e=>{if(!tSw||e.pointerId!==tSw.id)return;const dx=e.clientX-tSw.x,dy=e.clientY-tSw.y;tSw=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;tSwipe(Math.abs(dx)>Math.abs(dy)?(dx>0?2:0):(dy>0?3:1));});
document.addEventListener('keydown',e=>{if(C.page!=='t2048')return;const k={ArrowLeft:0,ArrowUp:1,ArrowRight:2,ArrowDown:3}[e.key];if(k===undefined)return;e.preventDefault();tSwipe(k);});
setInterval(()=>{const g=C.mines;if(C.page==='mines'&&g&&g.started&&!g.over)render();},1000);
$app.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,d=t.dataset;
  switch(a){
    case 'setMode':C.mode=d.m;C.err='';C.codeIn='';persist();render();break;
    case 'clawOpen':if(C.claw&&C.claw.busy)break;C.claw={busy:false,phase:'idle'};C.page='claw';render();break;
    case 'slotsOpen':if(C.slots&&C.slots.busy)break;if(!C.slots)C.slots={bet:10};C.page='slots';render();break;
    case 'slotsBet':if(C.slots&&C.slots.busy)break;C.slots=Object.assign(C.slots||{},{bet:+d.b});render();break;
    case 'slotsSpin':slotsSpin();break;
    case 'solOpen':if((C.claw&&C.claw.busy)||(C.slots&&C.slots.busy))break;C.page='solitaire';render();break;
    case 'solTap':solTap(d.k,+d.i,+d.j);break;
    case 'plkOpen':if((C.claw&&C.claw.busy)||(C.slots&&C.slots.busy))break;C.page='plinko';render();break;
    case 'plkBet':{const P=plkState();P.bet=+d.b;if(P.busy){$app.querySelectorAll('.plkbets .seg-btn').forEach(b=>b.classList.toggle('is-on',+b.dataset.b===P.bet));const db=$app.querySelector('[data-a="plkDrop"]');if(db){db.textContent='Kugel fallen lassen · '+P.bet+' 🪙';db.disabled=W.coins<P.bet;}}else render();break;}
    case 'plkDrop':plkDrop();break;
    case 't2048Open':if((C.claw&&C.claw.busy)||(C.slots&&C.slots.busy))break;C.page='t2048';render();break;
    case 'tDir':tSwipe(+d.d);break;
    case 'tNew':C.t2048=tNew();tSave();render();break;
    case 'tBoard':break;
    case 'minesOpen':if((C.claw&&C.claw.busy)||(C.slots&&C.slots.busy))break;C.page='mines';render();break;
    case 'minTap':if(C.mSkip){C.mSkip=false;break;}minTap(+d.i,false);break;
    case 'minFlag':if(C.mines){C.mines.flag=!C.mines.flag;minSave();render();}break;
    case 'minNew':C.mines=minNew(C.mines?C.mines.level:'leicht');minSave();render();break;
    case 'minLevel':C.mines=minNew(d.l);minSave();render();break;
    case 'solUndo':solUndo();break;
    case 'solNew':C.sol=solNew(C.sol&&C.sol.draw3);solSave();render();break;
    case 'solDraw3':C.sol=solNew(!(C.sol&&C.sol.draw3));solSave();render();break;
    case 'clawBack':if((C.claw&&C.claw.busy)||(C.slots&&C.slots.busy))break;C.page=C.room?(C.room.phase==='lobby'?'lobby':'game'):'home';render();break;
    case 'clawPlay':clawPlay();break;
    case 'sellDupes':sellDupes(d.k);render();break;
    case 'sellAll':sellDupes(null);render();break;
    case 'copyInvite':{const link=d.link||'';try{await navigator.clipboard.writeText(link);C.copied=true;render();setTimeout(()=>{C.copied=false;render();},2000);}catch(e){toast('Kopieren nicht erlaubt – Link: '+link,'');}break;}
    case 'setStyle':W.style[d.t]=d.v;saveW();applyStyle();render();break;
    case 'create':{
      if(C.mode==='local'){C.isHost=true;C.cid=tabCid();const r=await post('/api/create',{name:C.name||'Spieler 1'});if(!r)break;LOCAL.seats=[{pid:r.pid,token:r.token,name:C.name||'Spieler 1'}];LOCAL.active=0;LOCAL.handoff=null;Object.assign(C,{code:r.code,pid:r.pid,token:r.token});connect();break;}
      if(C.mode==='online'){C.cid=tabCid();C.isHost=true;C.code=null;C.busy=true;C.err='';render();
        let idx;try{idx=await OL.connectAny();}catch(e){C.err=e.message+' Versuche es gleich nochmal.';C.busy=false;C.isHost=false;render();break;}C.busy=false;
        const r=await post('/api/create',{name:C.name,codeLen:6,code:makeOnlineCode(idx)});if(!r){leave();break;}Object.assign(C,{code:r.code,pid:r.pid,token:r.token});persist();OL.subscribeTopics();connect();break;}
      const r=await post('/api/create',{name:C.name});if(r){Object.assign(C,{code:r.code,pid:r.pid,token:r.token});persist();connect();}break;}
    case 'join':{
      if(C.mode==='online'){C.cid=tabCid();C.isHost=false;C.code=C.codeIn.toUpperCase();const first=brokerFromCode(C.code);C.busy=true;C.err='';render();
        let r=null;
        for(let k=0;k<BROKERS.length;k++){OL.brokerIdx=(first+k)%BROKERS.length;C.err=k?'Keine Antwort – versuche Relay '+(k+1)+' von '+BROKERS.length+' …':'';render();
          try{await OL.connect();}catch(e){C.err=e.message;continue;}
          const res=await OL.send('/api/join',{code:C.code,name:C.name});
          if(res.status===200){r=res.body;break;}
          C.err=res.body&&res.body.error||'Fehler';if(res.status!==0)break; // echte Antwort (voll, läuft schon): nicht weiterprobieren
        }
        C.busy=false;if(!r){C.code=null;OL.closeAll();render();break;}
        Object.assign(C,{code:r.code,pid:r.pid,token:r.token});persist();OL.pub(OL.topicHost(),{type:'sub',from:C.cid,pid:C.pid,token:C.token});break;}
      const r=await post('/api/join',{code:C.codeIn,name:C.name});if(r){Object.assign(C,{code:r.code,pid:r.pid,token:r.token});persist();connect();}break;}
    case 'reload':location.reload();break;
    case 'localAdd':{const nm=LOCAL.nameIn.trim();if(!nm)break;const r=await post('/api/join',{code:C.code,name:nm});if(r){LOCAL.seats.push({pid:r.pid,token:r.token,name:nm});LOCAL.nameIn='';localSync();}break;}
    case 'localRemove':{const i=+d.i;const seat=LOCAL.seats[i];if(!seat||i===0&&LOCAL.seats.length===1)break;await post('/api/action',{code:C.code,pid:seat.pid,token:seat.token,action:'leave',data:{}});LOCAL.seats.splice(i,1);if(i===0){const s0=LOCAL.seats[0];C.pid=s0.pid;C.token=s0.token;}LOCAL.active=0;localSync();break;}
    case 'handoffOk':{LOCAL.handoff=null;const seat=LOCAL.seats[LOCAL.active];C.pid=seat.pid;C.token=seat.token;const mine=await localStateFor(seat);C.handoffRoom=null;if(mine){mine.isHost=true;C.roomKey=null;applyRoom(mine);}break;}
    case 'leaveLobby':await post('/api/action',{code:C.code,pid:C.pid,token:C.token,action:'leave',data:{}});leave();break;
    case 'leaveGame':leave();break;
    case 'kick':act('kick',{i:+d.i});break;
    case 'menu':C.confirm=!C.confirm;render();break;
    case 'menuNo':C.confirm=false;render();break;
    case 'backToLobby':C.confirm=false;act('backToLobby');break;
    case 'setGame':act('setGame',{g:d.g});break;
    case 'setVariant':act('setVariant',{v:d.v});break;
    case 'setTurn':act('setTurn',{ms:+d.ms});break;
    case 'setMax':act('setMax',{n:+d.n});break;
    case 'selH':C.sel.h=C.sel.h===+d.i?-1:+d.i;render();break;
    case 'selT':C.sel.t=C.sel.t===+d.i?-1:+d.i;render();break;
    case 'swap':act('swap',{h:C.sel.h,t:C.sel.t});C.sel={h:-1,t:-1};break;
    case 'hold':act('hold',{i:d.i});break;
    case 'ucard':{const i=+d.i;const card=C.room.view.players[C.room.view.me].hand[i];if(!card)break;
      if(card.c==='w'){C.wildIdx=i;C.pick=null;render();break;}
      if(C.pick===i||(C.room.view.drew===i&&C.pick===null)){C.pick=null;act('play',{i});}else{C.pick=i;render();}break;}
    case 'playPick':{const i=C.pick!==null?C.pick:C.room.view.drew;C.pick=null;if(i!==null)act('play',{i});break;}
    case 'bjAdd':{const mine=C.room.view.players[C.room.view.me];C.bjBet=Math.max(0,Math.min(mine.chips,(C.bjBet||0)+(+d.v)));render();break;}
    case 'bjClear':C.bjBet=0;render();break;
    case 'bjAllin':C.bjBet=C.room.view.players[C.room.view.me].chips;render();break;
    case 'bjBet':act('bet',{amount:C.bjBet});C.bjBet=0;break;
    case 'bjUnbet':act('unbet',{});break;
    case 'bjHit':act('hit',{});break;
    case 'bjStand':act('stand',{});break;
    case 'bjDouble':act('double',{});break;
    case 'bjNext':act('nextRound',{});break;
    case 'wild':{const i=C.wildIdx;C.wildIdx=null;act('play',{i,color:d.c});break;}
    case 'wildCancel':C.wildIdx=null;C.pick=null;render();break;
    case 'score':act('score',{k:d.k});break;
    default:act(a,{});
  }
});
if(C.code&&C.pid&&C.token&&((C.mode==='online'&&C.isHost)||C.mode==='local')){C.code=C.pid=C.token=null;C.isHost=false;persist();}
if(C.code&&C.pid&&C.token){if(C.mode==='online'){C.cid=tabCid();OL.brokerIdx=brokerFromCode(C.code);}connect();}else render();
if(location.hash==='#dbg')window.__stuben={get C(){return C},get W(){return W},render,solAuto,solTryMove,solDraw,solUndo,solCheckWin,SOL_SUITS,SOL_RANKS,minTap,minNew,MIN_LV,tMove,tNew,tCanMove,tSwipe,tAfterMove,plkDrop,plkState,PLK_MULT};
if(INVITE&&!C.code&&C.name&&C.codeIn.length>=4){setTimeout(()=>{const b=$app.querySelector('[data-a="join"]');if(b&&!b.disabled)b.click();},300);}
})();
</script>
